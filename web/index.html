<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title>Number Connections</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="../style.css">
        <link rel="icon" type="image/png" href="/favicon.png">
    </head>
    <body>
        <h1>Connections: oops! all numbers</h1>
        <p>Make four groups of four.</p>
        <noscript>This game needs JavaScript.</noscript>
        <div id="grid" role="group" aria-label="Number tiles"></div>
        <div class="controls">
            <button type="button" id="submit-btn" disabled>Submit</button>
            <span id="mistakes" role="status" aria-live="polite">Mistakes: 0/4</span>
        </div>
        <div id="message" class="message" role="status" aria-live="polite"></div>
        <footer>Data from <a href="https://oeis.org">OEIS (oeis.org)</a>.</footer>
        <script src="puzzles/manifest.js"></script>
        <script>
            (function () {
                const today = new Date();
                const y = today.getFullYear();
                const m = today.getMonth();
                const d = today.getDate();

                window.PUZZLE_DATE_KEY = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

                const dayNumber = Math.floor(Date.UTC(y, m, d) / 86400000);
                const index = ((dayNumber % PUZZLE_POOL_SIZE) + PUZZLE_POOL_SIZE) % PUZZLE_POOL_SIZE;
                const name = String(index).padStart(PUZZLE_INDEX_WIDTH, "0");

                const puzzleScript = document.createElement("script");
                puzzleScript.src = `puzzles/${name}.js`;
                puzzleScript.onload = function () {
                    const appScript = document.createElement("script");
                    appScript.src = "app.js";
                    document.body.appendChild(appScript);
                };
                document.body.appendChild(puzzleScript);
            })();
        </script>
    </body>
</html>
